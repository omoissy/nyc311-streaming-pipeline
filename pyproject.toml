[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-data-streaming-pipeline"
version = "1.0.0"
description = "Airflow, Kafka, Spark Structured Streaming and Cassandra user-profile pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka==2.8.0",
  "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
  "pyspark==3.5.5",
  "pytest==8.3.4",
  "ruff==0.8.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "spark/app"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
