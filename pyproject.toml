[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc311-streaming-pipeline"
version = "2.0.0"
description = "Real NYC 311 data pipeline with Airflow, Kafka, Spark and Cassandra"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka==2.8.0",
  "psycopg2-binary==2.9.10",
  "requests==2.32.3",
  "tzdata==2025.2",
]

[project.optional-dependencies]
dev = [
  "pyspark==3.5.5",
  "pytest==8.3.4",
  "ruff==0.8.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "spark/app"]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: calls the real NYC Open Data API (set RUN_LIVE_TESTS=1)"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
