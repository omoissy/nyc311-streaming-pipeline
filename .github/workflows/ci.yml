name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4  # PySpark tests need a JVM
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install -r requirements-dev.txt
      - run: make check

  compose-e2e:
    name: End-to-end (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: unit
    env:
      # Unpausing also fires a scheduled run; keep it as small as the triggered one.
      MAX_RECORDS_PER_RUN: "300"
      REFRESH_WINDOW_DAYS: "2"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d
      - run: ./scripts/e2e.sh
      - if: always()
        run: docker compose ps -a && docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
